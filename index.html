<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Galaxy - Minh Huy</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;user-select:none}
body,html{width:100%;height:100%;overflow:hidden;background:#020106;color:#fff}
#canvas-container{width:100%;height:100%;position:absolute;inset:0;z-index:1}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200}
.bg-hearts{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.floating-heart{position:absolute;bottom:-50px;color:rgba(255,0,127,.6);animation:riseHeart 6s infinite ease-in;font-size:20px}
@keyframes riseHeart{0%{transform:translateY(0) scale(.6);opacity:0}50%{opacity:.8}100%{transform:translateY(-105vh) scale(1.4);opacity:0}}
.shooting-star{position:absolute;height:2px;background:linear-gradient(90deg,#fff,rgba(255,0,127,0));border-radius:50%;pointer-events:none;z-index:2;animation:shoot 3s linear infinite}
@keyframes shoot{0%{transform:rotate(315deg) translateX(0);opacity:1}100%{transform:rotate(315deg) translateX(-1000px);opacity:0}}
#gift-screen{position:absolute;inset:0;background:radial-gradient(circle at center,#220a3a 0%,#05010a 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;transition:opacity 1s,visibility 1s}
.gift-container{text-align:center;cursor:pointer;animation:floatGift 3s infinite ease-in-out}
.gift-box{font-size:110px;filter:drop-shadow(0 0 35px rgba(255,0,127,.9));transition:transform .4s cubic-bezier(.175,.885,.32,1.275)}
.gift-container:hover .gift-box{transform:scale(1.2) rotate(6deg)}
.gift-instruction{margin-top:25px;font-size:20px;font-weight:700;background:linear-gradient(45deg,#f6c,#fff,#f39);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1.5px;animation:pulseText 2s infinite alternate;padding:0 15px}
#card-modal{position:absolute;inset:0;background:rgba(2,1,6,.88);display:flex;justify-content:center;align-items:center;z-index:95;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;backdrop-filter:blur(12px)}
#card-modal.active{opacity:1;visibility:visible}
.card-box{background:linear-gradient(145deg,rgba(35,12,55,.95),rgba(15,5,25,.98));border:2px solid #ff007f;box-shadow:0 0 55px rgba(255,0,127,.75),inset 0 0 25px rgba(255,0,127,.4);border-radius:28px;padding:35px 30px;text-align:center;width:460px;max-width:92%;transform:scale(.7) translateY(30px);transition:transform .5s cubic-bezier(.175,.885,.32,1.275)}
#card-modal.active .card-box{transform:none}
.sender-tag{font-size:14px;text-transform:uppercase;letter-spacing:3px;color:#ff85c0;margin-bottom:6px;font-weight:700}
.card-title{font-size:24px;font-weight:900;margin-bottom:15px;text-shadow:0 0 12px #ff007f}
.cake{font-size:46px;cursor:pointer;margin-bottom:6px;display:inline-block;transition:transform .2s}
.cake:hover{transform:scale(1.15)}
.cake-hint{font-size:11px;color:#ff99dd;margin-bottom:10px}
.wishes-content{font-size:14px;color:#f3e6ff;line-height:1.7;margin-bottom:20px;font-style:italic;min-height:90px}
.love-timer{font-size:12px;color:#ff99dd;background:rgba(255,0,127,.15);border:1px dashed rgba(255,0,127,.4);padding:8px;border-radius:10px;margin-bottom:20px;font-weight:600}
.signature-name{font-size:22px;font-weight:bold;color:#ff66cc;margin-bottom:25px;text-shadow:0 0 10px #ff007f;font-family:'Brush Script MT',cursive;letter-spacing:2px}
.btn-main{background:linear-gradient(45deg,#ff007f,#8a2be2);color:#fff;border:none;padding:12px 30px;font-size:14px;font-weight:bold;border-radius:30px;cursor:pointer;box-shadow:0 0 25px #ff007f;transition:transform .2s}
.btn-main:hover{transform:scale(1.08)}
#music-toggle{position:absolute;top:20px;left:20px;background:rgba(25,10,40,.85);border:1px solid #ff007f;width:42px;height:42px;border-radius:50%;display:flex;justify-content:center;align-items:center;cursor:pointer;z-index:150;box-shadow:0 0 15px rgba(255,0,127,.5);font-size:18px}
#control-panel{position:absolute;top:20px;right:20px;background:rgba(15,5,25,.85);border:1px solid rgba(255,0,127,.4);border-radius:12px;padding:12px;z-index:10;width:190px;backdrop-filter:blur(8px);font-size:11px;display:none;opacity:0;transition:opacity 1s}
.control-group{margin-bottom:8px}
.control-group label{display:block;margin-bottom:4px;color:#ff85c0;font-weight:600}
.control-group input[type=color]{width:100%;height:24px;border:none;border-radius:4px;cursor:pointer;background:none}
.control-group input[type=range]{width:100%;accent-color:#ff007f}
.hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;font-size:12px;color:#ffb3e1;background:rgba(15,5,25,.7);padding:8px 16px;border-radius:20px;opacity:0;transition:opacity 1s;pointer-events:none;text-align:center}
#media-modal{position:absolute;inset:0;background:rgba(0,0,0,.82);display:flex;justify-content:center;align-items:center;z-index:90;opacity:0;visibility:hidden;transition:opacity .3s;backdrop-filter:blur(8px)}
#media-modal.active{opacity:1;visibility:visible}
.media-card{background:rgba(22,8,38,.96);border:2px solid #ff007f;box-shadow:0 0 45px rgba(255,0,127,.8);border-radius:24px;padding:25px;text-align:center;width:380px;max-width:90%;position:relative}
.media-avatar{width:130px;height:130px;border-radius:50%;border:3px solid #ff007f;object-fit:cover;margin:0 auto 15px;box-shadow:0 0 20px #ff007f;display:block}
.close-btn{position:absolute;top:12px;right:18px;color:#aaa;font-size:24px;cursor:pointer}
@keyframes floatGift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-15px) rotate(2deg)}}
@keyframes pulseText{0%{opacity:.8}100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.floating-heart,.shooting-star,.gift-container{animation:none}}
</style>
</head>
<body>
<div class="bg-hearts" id="bgHearts"></div>
<canvas id="confetti"></canvas>
<audio id="bgMusic" loop><source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf7f6.mp3?filename=romantic-lofi-112152.mp3" type="audio/mpeg"></audio>
<div id="music-toggle" onclick="toggleMusic()" title="Bật/Tắt Nhạc">🎵</div>
<div id="canvas-container"></div>

<div id="gift-screen">
  <div class="gift-container" onclick="openGiftCard()">
    <div class="gift-box">🎁</div>
    <div class="gift-instruction">✨ Chạm để mở món quà đặc biệt từ Minh Huy ✨</div>
  </div>
</div>

<div id="card-modal">
  <div class="card-box">
    <div class="sender-tag">⭐ Minh Huy Gửi Đến Bạn ⭐</div>
    <h2 class="card-title">Chúc Mừng Sinh Nhật 💖</h2>
    <div class="cake" id="cake" onclick="blowCandle()">🎂</div>
    <div class="cake-hint" id="cakeHint">🕯️ Chạm vào bánh để thổi nến và ước một điều ước nhé!</div>
    <div class="wishes-content" id="typewriterText"></div>
    <div class="love-timer" id="loveTimer"></div>
    <div class="signature-name">Minh Huy</div>
    <button class="btn-main" onclick="enterGalaxy()">KHÁM PHÁ VŨ TRỤ 🌌</button>
  </div>
</div>

<div id="control-panel">
  <div class="control-group"><label>Màu Trái Tim Trung Tâm</label><input type="color" id="centerColor" value="#ff007f"></div>
  <div class="control-group"><label>Màu Hạt Thiên Hà</label><input type="color" id="particleColor" value="#ffffff"></div>
  <div class="control-group"><label>Độ Sáng Chấm Sáng</label><input type="range" id="brightness" min="1" max="3" step="0.1" value="2.2"></div>
  <div class="control-group"><label><input type="checkbox" id="autoRotate" checked> Tự động xoay camera</label></div>
</div>
<div class="hint" id="hint">👆 Chạm vào ảnh để đọc lời chúc · Chạm vào trái tim để nhận bất ngờ</div>

<div id="media-modal">
  <div class="media-card">
    <span class="close-btn" onclick="closeMediaModal()">&times;</span>
    <img id="modal-img" class="media-avatar" src="" alt="Ảnh kỷ niệm">
    <h3 id="modal-title" style="font-size:18px;margin-bottom:10px;text-shadow:0 0 8px #ff007f"></h3>
    <p id="modal-text" style="font-size:13px;color:#e2cef5;line-height:1.6;margin-bottom:20px"></p>
    <button class="btn-main" style="padding:8px 24px;font-size:13px" onclick="closeMediaModal()">Yêu Lắm 💕</button>
  </div>
</div>

<script>
/* ====== CẤU HÌNH: sửa ở đây ====== */
const CONFIG = {
  startDate: '2024-01-01T00:00:00',   // mốc ngày kỷ niệm
  bigText: 'HAPPY BIRTHDAY',          // chữ lớn bay trên trái tim
  message: "Trái đất quay quanh mặt trời, còn thế giới của mình chỉ mong quanh quẩn bên nụ cười của bạn.\n\nChúc bạn tuổi mới luôn rực rỡ như những vì sao, an yên như dải ngân hà và mỗi ngày trôi qua đều tràn ngập niềm vui!",
  secret: { title: 'Bất ngờ nhỏ 💌', text: 'Bạn vừa chạm vào trái tim của vũ trụ này rồi đó. Cảm ơn vì đã là một phần đẹp nhất trong câu chuyện của mình. Yêu bạn nhiều lắm! 💖' }
};
const wishesData = [
  { img:'./anh.jpg',  title:'Nụ Cười Tỏa Sáng ✨', text:'Mong rằng nụ cười này sẽ luôn nở trên môi bạn mỗi ngày. Chúc bạn tuổi mới luôn gặp nhiều may mắn và thành công rực rỡ!' },
  { img:'./anh1.jpg', title:'Khoảnh Khắc Ngọt Ngào 🌸', text:'Cảm ơn vì đã xuất hiện và mang đến thật nhiều năng lượng tích cực. Chúc mọi điều ước của bạn trong tuổi mới đều trở thành hiện thực!' },
  { img:'./anh2.jpg', title:'Bình An & Hạnh Phúc 💖', text:'Chúc bạn bước sang tuổi mới với một trái tim kiên cường, một tinh thần rạng ngời và luôn có bình an ở bên cạnh.' },
  { img:'./anh3.jpg', title:'Tựa Như Những Vì Sao 🌟', text:'Bạn rất đặc biệt và xứng đáng nhận được những điều tốt đẹp nhất trên đời này. Mãi rực rỡ như thế nhé!' }
];

/* ====== Hiệu ứng nền ====== */
setInterval(() => {
  const h = document.createElement('div');
  h.className = 'floating-heart';
  h.textContent = ['💖','✨','🌸','💫','❤️'][Math.floor(Math.random()*5)];
  h.style.left = Math.random()*100 + 'vw';
  h.style.animationDuration = (Math.random()*3+4) + 's';
  document.getElementById('bgHearts').appendChild(h);
  setTimeout(() => h.remove(), 7000);
}, 500);
setInterval(() => {
  const s = document.createElement('div');
  s.className = 'shooting-star';
  s.style.top = Math.random()*50 + 'vh';
  s.style.left = Math.random()*100 + 'vw';
  s.style.width = (Math.random()*80+60) + 'px';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 3000);
}, 2500);

/* ====== Pháo giấy (confetti) ====== */
const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
let bits = [], confettiOn = false;
function sizeConfetti(){ cv.width = innerWidth; cv.height = innerHeight; }
sizeConfetti();
function burst(x, y, n = 120) {
  const syms = ['💖','✨','🌸','⭐','🎉'], cols = ['#ff007f','#ff66cc','#ffd1f0','#b36bff','#fff'];
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, sp = Math.random()*9 + 3;
    bits.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 4, life:1, r:Math.random()*6+3,
      col:cols[i%cols.length], sym:Math.random()<.3 ? syms[i%syms.length] : null, rot:Math.random()*6 });
  }
  if (!confettiOn) { confettiOn = true; tickConfetti(); }
}
function tickConfetti() {
  cx.clearRect(0, 0, cv.width, cv.height);
  bits = bits.filter(b => b.life > 0);
  bits.forEach(b => {
    b.x += b.vx; b.y += b.vy; b.vy += .18; b.vx *= .985; b.life -= .008; b.rot += .12;
    cx.globalAlpha = Math.max(b.life, 0);
    if (b.sym) { cx.font = (b.r*3.2) + 'px serif'; cx.fillText(b.sym, b.x, b.y); }
    else { cx.save(); cx.translate(b.x, b.y); cx.rotate(b.rot); cx.fillStyle = b.col; cx.fillRect(-b.r, -b.r/2, b.r*2, b.r); cx.restore(); }
  });
  cx.globalAlpha = 1;
  if (bits.length) requestAnimationFrame(tickConfetti); else confettiOn = false;
}

/* ====== Nhạc ====== */
let isMusicPlaying = false;
function toggleMusic() {
  const a = document.getElementById('bgMusic'), b = document.getElementById('music-toggle');
  if (isMusicPlaying) { a.pause(); b.textContent = '🎵'; }
  else { a.play().catch(() => {}); b.textContent = '🔊'; }
  isMusicPlaying = !isMusicPlaying;
}

/* ====== Thiệp: gõ chữ, bộ đếm, thổi nến ====== */
function startTypewriter() {
  const t = document.getElementById('typewriterText'); let i = 0; t.innerHTML = '';
  (function type() {
    if (i < CONFIG.message.length) {
      const c = CONFIG.message.charAt(i++);
      t.innerHTML += c === '\n' ? '<br>' : c;
      setTimeout(type, 35);
    }
  })();
}
function updateLoveTimer() {
  const d = new Date() - new Date(CONFIG.startDate);
  const days = Math.floor(d/864e5), hrs = Math.floor(d/36e5)%24, min = Math.floor(d/6e4)%60, sec = Math.floor(d/1e3)%60;
  document.getElementById('loveTimer').innerHTML = `⏳ Đã đồng hành cùng nhau: <b>${days} ngày ${hrs} giờ ${min} phút ${sec} giây</b> ✨`;
}
setInterval(updateLoveTimer, 1000);
let candleOut = false;
function blowCandle() {
  if (candleOut) return;
  candleOut = true;
  document.getElementById('cake').textContent = '🍰';
  document.getElementById('cakeHint').textContent = '🌟 Điều ước đã bay lên các vì sao rồi nhé!';
  burst(innerWidth/2, innerHeight/3, 160);
}
function openGiftCard() {
  document.getElementById('gift-screen').style.opacity = '0';
  document.getElementById('gift-screen').style.visibility = 'hidden';
  document.getElementById('card-modal').classList.add('active');
  if (!isMusicPlaying) {
    document.getElementById('bgMusic').play().catch(() => {});
    document.getElementById('music-toggle').textContent = '🔊';
    isMusicPlaying = true;
  }
  startTypewriter(); updateLoveTimer();
  burst(innerWidth/2, innerHeight/2, 100);
}

/* ====== Three.js ====== */
let scene, camera, renderer, controls, heartMesh, galaxyParticles, titleSprite;
let interactiveNodes = [], isFlying = false, flyProgress = 0;
const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
raycaster.params.Points.threshold = 2.5;
const PLACEHOLDER = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0,0,256,256);
  gr.addColorStop(0,'#ff3399'); gr.addColorStop(1,'#6a1b9a');
  g.fillStyle = gr; g.fillRect(0,0,256,256);
  g.font = '130px serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('💖', 128, 140);
  return c;
})();

function enterGalaxy() {
  document.getElementById('card-modal').style.opacity = '0';
  document.getElementById('card-modal').style.visibility = 'hidden';
  init3DScene();
  isFlying = true; flyProgress = 0;
  setTimeout(() => {
    const p = document.getElementById('control-panel'), h = document.getElementById('hint');
    p.style.display = 'block'; requestAnimationFrame(() => p.style.opacity = '1'); h.style.opacity = '1';
    setTimeout(() => h.style.opacity = '0', 7000);
  }, 1800);
}
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.25,'rgba(255,105,180,.95)');
  gr.addColorStop(.6,'rgba(210,0,130,.4)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0,0,64,64);
  const t = new THREE.Texture(c); t.needsUpdate = true; return t;
}
function init3DScene() {
  if (renderer) return;
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x020106, 0.006);
  camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1200);
  camera.position.set(0, 120, 260);
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.05;
  controls.maxDistance = 100; controls.minDistance = 12;
  controls.autoRotateSpeed = 0.6; controls.autoRotate = true;
  controls.enabled = false;

  scene.add(new THREE.AmbientLight(0xffffff, 1.4));
  const tex = glowTexture();
  createStarfield(tex); createGalaxy(tex); createHeart(tex); createTitle(); createPhotos();

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight); sizeConfetti();
  });
  let dx = 0, dy = 0;
  addEventListener('pointerdown', e => { dx = e.clientX; dy = e.clientY; });
  addEventListener('pointerup', e => {
    if (!controls.enabled || document.getElementById('media-modal').classList.contains('active')) return;
    if (Math.abs(e.clientX-dx) > 10 || Math.abs(e.clientY-dy) > 10) return;
    if (e.target.closest('#control-panel,#music-toggle')) return;
    mouse.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
    raycaster.setFromCamera(mouse, camera);
    const hit = raycaster.intersectObjects(interactiveNodes);
    if (hit.length) { showMediaModal(hit[0].object.userData); return; }
    if (raycaster.intersectObject(heartMesh).length) {
      burst(e.clientX, e.clientY, 200);
      showMediaModal({ img: PLACEHOLDER.toDataURL(), ...CONFIG.secret });
    }
  });
  document.getElementById('centerColor').addEventListener('input', e => heartMesh.material.color.set(e.target.value));
  document.getElementById('particleColor').addEventListener('input', e => galaxyParticles.material.color.set(e.target.value));
  document.getElementById('brightness').addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    galaxyParticles.material.size = v * 0.19;
    heartMesh.material.size = v * 0.22;
  });
  document.getElementById('autoRotate').addEventListener('change', e => controls.autoRotate = e.target.checked);
  animate();
}
function createStarfield(tex) {
  const n = 3500, pos = new Float32Array(n*3);
  for (let i = 0; i < n; i++) {
    const r = 220 + Math.random()*400, th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    pos[i*3] = r*Math.sin(ph)*Math.cos(th); pos[i*3+1] = r*Math.sin(ph)*Math.sin(th); pos[i*3+2] = r*Math.cos(ph);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size:2.2, map:tex, transparent:true, opacity:.8, color:0xcfc2ff, blending:THREE.AdditiveBlending, depthWrite:false, fog:false })));
}
function createGalaxy(tex) {
  const n = 18000, g = new THREE.BufferGeometry(), pos = new Float32Array(n*3), col = new Float32Array(n*3);
  const cIn = new THREE.Color('#ff1a8c'), cOut = new THREE.Color('#4a0080');
  for (let i = 0; i < n; i++) {
    const r = Math.random()*40 + 3, spin = r*0.7, br = ((i%4)*2*Math.PI)/4;
    pos[i*3] = Math.cos(br+spin)*r + (Math.random()-.5)*2.5;
    pos[i*3+1] = (Math.random()-.5)*2.5;
    pos[i*3+2] = Math.sin(br+spin)*r + (Math.random()-.5)*2.5;
    const c = cIn.clone().lerp(cOut, r/40);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  galaxyParticles = new THREE.Points(g, new THREE.PointsMaterial({ size:0.42, map:tex, vertexColors:true, transparent:true, opacity:.95, blending:THREE.AdditiveBlending, depthWrite:false }));
  scene.add(galaxyParticles);
}
function createHeart(tex) {
  const n = 2500, g = new THREE.BufferGeometry(), pos = new Float32Array(n*3);
  for (let i = 0; i < n; i++) {
    const t = Math.PI*2*Math.random(), u = Math.random()*2-1;
    const x = 16*Math.pow(Math.sin(t),3)*.3;
    const y = (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t))*.3;
    pos[i*3] = x + (Math.random()-.5)*.2; pos[i*3+1] = y + (Math.random()-.5)*.2; pos[i*3+2] = u*1.8 + (Math.random()-.5)*.2;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  heartMesh = new THREE.Points(g, new THREE.PointsMaterial({ color:0xff007f, size:0.48, map:tex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
  heartMesh.position.y = 2.5; scene.add(heartMesh);
}
function createTitle() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
  const g = c.getContext('2d');
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = '900 120px "Segoe UI",sans-serif';
  g.shadowColor = '#ff007f'; g.shadowBlur = 40;
  const gr = g.createLinearGradient(0,0,1024,0);
  gr.addColorStop(0,'#ff66cc'); gr.addColorStop(.5,'#ffffff'); gr.addColorStop(1,'#c58cff');
  g.fillStyle = gr; g.fillText(CONFIG.bigText, 512, 110);
  g.font = '70px serif'; g.shadowBlur = 0; g.fillText('🎂 ✨ 💖 ✨ 🎂', 512, 210);
  const t = new THREE.CanvasTexture(c);
  titleSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map:t, transparent:true, depthWrite:false, fog:false }));
  titleSprite.scale.set(28, 7, 1); titleSprite.position.set(0, 13, 0);
  scene.add(titleSprite);
}
function createPhotos() {
  const loader = new THREE.TextureLoader(), total = wishesData.length;
  wishesData.forEach((item, idx) => {
    const build = tex => {
      const grp = new THREE.Group();
      grp.add(new THREE.Mesh(new THREE.RingGeometry(1.8, 2.0, 32), new THREE.MeshBasicMaterial({ color:0xff007f, side:THREE.DoubleSide })));
      const m = new THREE.Mesh(new THREE.CircleGeometry(1.75, 32), new THREE.MeshBasicMaterial({ map:tex, side:THREE.DoubleSide }));
      grp.add(m);
      item.angle = (idx/total)*Math.PI*2; item.baseY = idx%2 === 0 ? 1.5 : -1.5;
      m.userData = { ...item };
      interactiveNodes.push(m); scene.add(grp); item.nodeGroup = grp;
    };
    // Nếu ảnh thiếu/lỗi: dùng ảnh trái tim thay thế, vòng quay vẫn hiện đủ
    loader.load(item.img, build, undefined, () => { item.img = PLACEHOLDER.toDataURL(); build(new THREE.CanvasTexture(PLACEHOLDER)); });
  });
}
function animate() {
  requestAnimationFrame(animate);
  const time = Date.now();
  if (isFlying) {
    flyProgress = Math.min(flyProgress + 0.012, 1);
    if (flyProgress === 1) { isFlying = false; controls.enabled = true; }
    const e = 1 - Math.pow(1 - flyProgress, 3);
    camera.position.set(0, 120 - 102*e, 260 - 218*e);
    camera.lookAt(0, 2, 0);
  }
  galaxyParticles.rotation.y += 0.001;
  heartMesh.rotation.y += 0.004;
  heartMesh.scale.setScalar(1 + Math.sin(time*0.003)*0.09);
  titleSprite.position.y = 13 + Math.sin(time*0.0015)*0.8;
  wishesData.forEach(it => {
    if (!it.nodeGroup) return;
    it.angle += 0.0018;
    it.nodeGroup.position.set(Math.cos(it.angle)*16, it.baseY + Math.sin(time*0.001 + it.angle*3)*0.4, Math.sin(it.angle)*16);
    it.nodeGroup.lookAt(camera.position);
  });
  if (controls.enabled) controls.update();
  renderer.render(scene, camera);
}

/* ====== Modal ảnh ====== */
function showMediaModal(d) {
  const img = document.getElementById('modal-img');
  img.onerror = () => { img.onerror = null; img.src = PLACEHOLDER.toDataURL(); };
  img.src = d.img;
  document.getElementById('modal-title').innerText = d.title;
  document.getElementById('modal-text').innerText = d.text;
  document.getElementById('media-modal').classList.add('active');
}
function closeMediaModal() { document.getElementById('media-modal').classList.remove('active'); }
</script>
